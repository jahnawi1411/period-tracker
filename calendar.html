<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Calendar | Period Tracker</title>

    <!-- GOOGLE FONTS -->

    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- FONT AWESOME -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS FILES -->

    <link rel="stylesheet"
        href="css/global.css">

    <link rel="stylesheet"
        href="css/calendar.css">

</head>

<body>

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">

            <i class="fa-solid fa-heart-circle-bolt"></i>

            <span>Period Tracker</span>

        </div>

        <nav class="sidebar-menu">

            <a href="dashboard.html">

                <i class="fa-solid fa-table-columns"></i>

                Dashboard

            </a>

            <a href="tracker.html">

                <i class="fa-solid fa-calendar-check"></i>

                Track Cycle

            </a>

            <a href="calendar.html"
                class="active">

                <i class="fa-solid fa-calendar-days"></i>

                Calendar

            </a>

            <a href="insights.html">

                <i class="fa-solid fa-chart-line"></i>

                Insights

            </a>

            <a href="settings.html">

                <i class="fa-solid fa-gear"></i>

                Settings

            </a>

            <button id="logoutBtn">

                <i class="fa-solid fa-right-from-bracket"></i>

                Logout

            </button>

        </nav>

    </aside>

    <!-- MAIN CONTENT -->

    <main class="main-content">

        <!-- TOPBAR -->

        <header class="topbar">

            <div>

                <h1>Cycle Calendar</h1>

                <p>
                    Visualize your menstrual cycle and
                    predictions.
                </p>

            </div>

        </header>

        <!-- CALENDAR SECTION -->

        <section class="calendar-section">

            <div class="calendar-card">

                <!-- HEADER -->

                <div class="calendar-header">

                    <button id="prevMonthBtn">

                        <i class="fa-solid fa-angle-left"></i>

                    </button>

                    <h2 id="monthYear"></h2>

                    <button id="nextMonthBtn">

                        <i class="fa-solid fa-angle-right"></i>

                    </button>

                </div>

                <!-- WEEK DAYS -->

                <div class="weekdays">

                    <div>Sun</div>
                    <div>Mon</div>
                    <div>Tue</div>
                    <div>Wed</div>
                    <div>Thu</div>
                    <div>Fri</div>
                    <div>Sat</div>

                </div>

                <!-- CALENDAR GRID -->

                <div id="calendarGrid"
                    class="calendar-grid">

                    <!-- Dynamic Calendar -->

                </div>

            </div>

        </section>

        <!-- LEGEND SECTION -->

        <section class="legend-section">

            <div class="legend-card">

                <h2>Calendar Legend</h2>

                <div class="legend-grid">

                    <div class="legend-item">

                        <span class="legend-color period"></span>

                        <p>Predicted Period</p>

                    </div>

                    <div class="legend-item">

                        <span class="legend-color ovulation"></span>

                        <p>Ovulation Day</p>

                    </div>

                    <div class="legend-item">

                        <span class="legend-color fertile"></span>

                        <p>Fertile Window</p>

                    </div>

                    <div class="legend-item">

                        <span class="legend-color today"></span>

                        <p>Today</p>

                    </div>

                </div>

            </div>

        </section>

    </main>

    <!-- JAVASCRIPT FILES -->

    <script src="js/storage.js"></script>

    <script src="js/utils.js"></script>

    <script src="js/calendar.js"></script>

</body>

</html>
